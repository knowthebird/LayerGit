[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layergit"
version = "0.1.0"
description = "Prototype CLI for composing layered Git workspaces."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["coverage>=7.6"]

[project.scripts]
layer = "layergit.cli:main"
layergit = "layergit.cli:main"

[tool.setuptools]
packages = ["layergit"]

[tool.coverage.run]
source = ["layergit"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
