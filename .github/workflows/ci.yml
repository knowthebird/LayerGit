name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest

      - name: Run coverage
        run: |
          coverage erase
          LAYERGIT_TEST_COVERAGE=1 coverage run --parallel-mode -m unittest
          coverage combine
          coverage report --fail-under=100

      - name: Run overlap demo
        run: examples/overlap-demo.sh

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile
        working-directory: vscode-extension
        run: npm run compile

      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package
